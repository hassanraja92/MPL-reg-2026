<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login — MPL 2026</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/static/images/logo-mpl.svg">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg mb-4 header-nav">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center" href="/">
        <img src="/static/images/logo-mpl.svg" alt="MPL 2026" height="54" style="margin-right:14px">
        <span class="brand-text">Maskedih Premier League</span>
      </a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link text-white" href="/">Register</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card card-primary">
          <div class="card-body">
            <h2 class="mb-4"><i class="bi bi-person-lock"></i> Admin Login</h2>
            <div id="alert-container"></div>
            <form id="loginForm">
              <div class="mb-3">
                <label class="form-label">Username</label>
                <input name="username" class="form-control" autocomplete="username" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Password</label>
                <input name="password" type="password" class="form-control" autocomplete="current-password" required>
              </div>
              <button type="submit" class="btn btn-brand w-100" id="loginBtn">Login</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Redirect if already logged in
    if (localStorage.getItem('mpl_token')) {
      window.location.href = '/dashboard/';
    }

    function showAlert(msg, type = 'danger') {
      document.getElementById('alert-container').innerHTML =
        `<div class="alert alert-${type}">${msg}</div>`;
    }

    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.textContent = 'Logging in…';

      const username = this.username.value.trim();
      const password = this.password.value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const json = await res.json();
        if (res.ok) {
          localStorage.setItem('mpl_token', json.token);
          localStorage.setItem('mpl_username', json.username);
          window.location.href = '/dashboard/';
        } else {
          showAlert(json.error || 'Login failed.');
          btn.disabled = false;
          btn.textContent = 'Login';
        }
      } catch {
        showAlert('Network error. Please try again.');
        btn.disabled = false;
        btn.textContent = 'Login';
      }
    });
  </script>
</body>
</html>
