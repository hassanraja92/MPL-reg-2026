<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard — MPL 2026</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/static/images/logo-mpl.svg">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg mb-4 header-nav">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center" href="/">
        <img src="/static/images/logo-mpl.svg" alt="MPL 2026" height="54" style="margin-right:14px">
        <span class="brand-text">Maskedih Premier League</span>
      </a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link text-white" href="/">Register</a></li>
          <li class="nav-item">
            <span class="nav-link text-white opacity-75" id="adminUsername"></span>
          </li>
          <li class="nav-item">
            <a class="nav-link text-warning" href="#" id="logoutLink">Logout</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container">
    <div id="content">
      <div class="text-center py-5 text-muted"><i class="bi bi-hourglass-split fs-1"></i><p>Loading dashboard…</p></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    const token = localStorage.getItem('mpl_token');
    if (!token) window.location.href = '/dashboard/login/';

    document.getElementById('adminUsername').textContent = localStorage.getItem('mpl_username') || '';

    document.getElementById('logoutLink').addEventListener('click', function (e) {
      e.preventDefault();
      localStorage.removeItem('mpl_token');
      localStorage.removeItem('mpl_username');
      window.location.href = '/dashboard/login/';
    });

    async function loadDashboard() {
      const res = await fetch('/api/dashboard', {
        headers: { Authorization: `Bearer ${token}` },
      });
      if (res.status === 401) {
        localStorage.removeItem('mpl_token');
        window.location.href = '/dashboard/login/';
        return;
      }
      const data = await res.json();

      const recentHtml = data.recent.length
        ? data.recent.map(p => `
            <li class="list-group-item d-flex justify-content-between">
              <span>${escHtml(p.fullName)} &mdash; ${escHtml(p.mobileNumber)}</span>
              <span class="text-muted small">${new Date(p.createdAt).toLocaleString()}</span>
            </li>`).join('')
        : '<li class="list-group-item text-muted">No recent registrations</li>';

      document.getElementById('content').innerHTML = `
        <div class="row mb-3">
          <div class="col-md-3">
            <div class="card text-white bg-primary mb-3 stat-card">
              <div class="card-body">
                <div><h5 class="card-title">Total</h5><p class="card-text fs-4">${data.total}</p></div>
                <i class="bi bi-people-fill fs-1"></i>
              </div>
            </div>
          </div>
          <div class="col-md-3">
            <div class="card text-white bg-success mb-3 stat-card">
              <div class="card-body">
                <div><h5 class="card-title">Approved</h5><p class="card-text fs-4">${data.approved}</p></div>
                <i class="bi bi-check-circle-fill fs-1"></i>
              </div>
            </div>
          </div>
          <div class="col-md-3">
            <div class="card text-dark bg-warning mb-3 stat-card">
              <div class="card-body">
                <div><h5 class="card-title">Pending</h5><p class="card-text fs-4">${data.pending}</p></div>
                <i class="bi bi-hourglass-split fs-1"></i>
              </div>
            </div>
          </div>
          <div class="col-md-3 text-end pt-2">
            <a href="/dashboard/players/" class="btn btn-outline-secondary mt-2 me-1">View Players</a>
          </div>
        </div>

        <h4>Recent Registrations</h4>
        <ul class="list-group mb-4">${recentHtml}</ul>

        <div class="card p-3 mt-2">
          <h5>Approval Ratio</h5>
          <div style="height:220px;max-width:320px">
            <canvas id="approvalChart"></canvas>
          </div>
        </div>
      `;

      const ctx = document.getElementById('approvalChart');
      if (ctx) {
        new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: ['Approved', 'Pending'],
            datasets: [{ data: [data.approved, data.pending], backgroundColor: ['#198754', '#ffc107'] }],
          },
          options: { responsive: true, maintainAspectRatio: false },
        });
      }
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    loadDashboard();
  </script>
</body>
</html>
